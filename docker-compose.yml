version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: merprest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: merprest
      POSTGRES_PASSWORD: merprest_secret
      POSTGRES_DB: merprest
    ports:
      - "5432:5432"
    volumes:
      - merprest_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merprest -d merprest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  merprest_pgdata:
