<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MerPrest · Demo sin servidor</title>
<style>
:root{--bg:#0a0e1a;--bg-soft:#0f1526;--panel:rgba(255,255,255,.04);--panel-solid:#121a2e;--border:rgba(255,255,255,.08);--text:#e8edf7;--dim:#8b96ad;--green:#22c55e;--blue:#3b82f6;--amber:#f59e0b;--red:#ef4444;--radius:14px;--font:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--text);background:radial-gradient(1100px 500px at 85% -10%,rgba(34,197,94,.08),transparent),radial-gradient(900px 500px at -10% 110%,rgba(59,130,246,.08),transparent),var(--bg);font-size:14px;min-height:100vh}
#app{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,#0e1526 0%,#0a0e1a 100%);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:24px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid var(--border);margin-bottom:16px}
.brand-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;font-weight:800;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:#fff;box-shadow:0 8px 22px rgba(34,197,94,.4)}
.brand-name{font-weight:800;font-size:18px;letter-spacing:.3px}
.brand-sub{font-size:11px;color:var(--dim);margin-top:2px}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--dim);padding:0 10px;margin-bottom:8px}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--dim);text-decoration:none;font-weight:600;font-size:13.5px;transition:all .18s}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.05);transform:translateX(3px)}
.nav-item.active{color:#fff;background:linear-gradient(135deg,rgba(34,197,94,.28),rgba(14,165,233,.12));box-shadow:inset 0 0 0 1px rgba(34,197,94,.4)}
.nav-item.active svg{opacity:1}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:0 4px 4px 0;background:var(--green);box-shadow:0 0 12px rgba(34,197,94,.7)}
.sidebar-foot{padding:16px 8px 4px;border-top:1px solid var(--border);margin-top:12px;font-size:11px;color:var(--dim);display:flex;flex-direction:column;gap:10px;line-height:1.6}
.sidebar-foot .reset-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--dim);border-radius:10px;padding:8px 10px;font-family:var(--font);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s;text-align:left}
.sidebar-foot .reset-btn:hover{color:var(--red);border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
@media(max-width:900px){
  .sidebar{width:72px;padding:20px 10px}
  .brand{justify-content:center;padding:4px 0 20px}
  .brand-name,.brand-sub,.nav-label,.nav-text,.sidebar-foot span{display:none}
  .nav-item{justify-content:center}
  .nav-item.active::before{left:-10px}
  .sidebar-foot{padding:12px 4px 4px;align-items:center}
  .sidebar-foot .reset-btn{width:44px;height:44px;border-radius:12px;font-size:0;display:grid;place-items:center}
  .sidebar-foot .reset-btn::after{content:"↺";font-size:16px}
}
.content{flex:1;padding:26px 34px 60px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
.topbar h1{font-size:24px;font-weight:800}
.clock{color:var(--dim);font-size:13px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.card-head h2{font-size:16px;font-weight:700}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:3px}
.accent-green::before{background:var(--green)}.accent-blue::before{background:var(--blue)}.accent-amber::before{background:var(--amber)}.accent-red::before{background:var(--red)}
.stat-label{font-size:12px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:25px;font-weight:800;margin:8px 0 6px;font-family:var(--mono)}
.stat-foot{font-size:12px;color:var(--dim)}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.045);white-space:nowrap}
.table tbody tr:hover{background:rgba(255,255,255,.03)}
.row-late{background:rgba(239,68,68,.05)}
.td-empty{text-align:center;color:var(--dim);padding:28px!important}
.mono{font-family:var(--mono)}
.danger{color:var(--red);font-weight:700}
.green-text{color:var(--green);font-weight:700}
.link{color:var(--blue);text-decoration:none;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-active{background:rgba(59,130,246,.15);color:#7ab3ff}
.badge-paid{background:rgba(34,197,94,.14);color:var(--green)}
.badge-late{background:rgba(239,68,68,.15);color:var(--red)}
.badge-pending{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-requested{background:rgba(139,150,173,.15);color:#aab4c8}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:transparent;color:var(--text);padding:9px 16px;border-radius:10px;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.3)}
.btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(59,130,246,.3)}
.btn-ghost:hover{background:var(--panel)}
.btn-danger{color:var(--red)}.btn-danger:hover{background:rgba(239,68,68,.12)}
.btn-sm{padding:5px 10px;font-size:12px}
.select,.sim-form input,.sim-form select{background:var(--panel-solid);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-family:var(--font);font-size:13px;outline:none}
.modal{background:var(--panel-solid);border:1px solid var(--border);border-radius:16px;color:var(--text);padding:0;width:min(480px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.55)}
.modal::backdrop{background:rgba(4,7,14,.7);backdrop-filter:blur(4px)}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:14px}
.modal-body h3{font-size:18px;font-weight:800}
.modal-body label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--dim)}
.modal-body input,.modal-body select{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-family:var(--font);font-size:14px;outline:none}
.modal-body input:focus{border-color:var(--green)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.preview{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.25);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.preview-row{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.preview-row strong{color:var(--text);font-family:var(--mono)}
.sim-table{max-height:340px;overflow-y:auto}
.subtitle{font-size:14px;font-weight:700;margin:18px 0 10px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:90px 1fr 110px;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.bar-track{height:10px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;transition:width .5s}
.bar-fill.green{background:var(--green)}.bar-fill.blue{background:var(--blue)}.bar-fill.red{background:var(--red)}
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0;color:var(--dim)}
.empty{padding:60px 20px;text-align:center}
.empty h2{font-size:20px;margin-bottom:10px}
.empty p{color:var(--dim);margin-bottom:18px}
.empty .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast-root{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{padding:12px 18px;border-radius:12px;font-weight:600;font-size:13px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:slidein .25s}
.toast-ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
.toast-err{background:linear-gradient(135deg,#dc2626,#ef4444)}
@keyframes slidein{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#263049;border-radius:999px}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-logo">₲</div><div><div class="brand-name">MerPrest</div><div class="brand-sub">Gestión de préstamos</div></div></div>
    <div class="nav-label">Menú</div>
    <nav class="nav">
      <a href="#/dashboard" data-nav="dashboard" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="nav-text">Panel</span>
      </a>
      <a href="#/loans" data-nav="loans" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span class="nav-text">Préstamos</span>
      </a>
      <a href="#/companies" data-nav="companies" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/></svg>
        <span class="nav-text">Empresas</span>
      </a>
      <a href="#/reports" data-nav="reports" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v-4"/><path d="M12 15V7"/><path d="M17 15v-6"/></svg>
        <span class="nav-text">Reportes</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <span>Modo demo · datos en tu navegador</span>
      <button class="reset-btn" onclick="resetData()">↺ Reiniciar datos</button>
    </div>
  </aside>
  <main class="content">
    <header class="topbar"><h1 id="page-title">Panel</h1><span class="clock" id="clock"></span></header>
    <div id="view"></div>
  </main>
</div>
<div id="toast-root"></div>

<script>
"use strict";
/* ============ Minibase (localStorage) ============ */
const DB_KEY = "merprest_db_v2";
let db = load();
function load(){ try{ return JSON.parse(localStorage.getItem(DB_KEY)) || seed(); }catch(e){ return seed(); } }
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function resetData(){ if(confirm("¿Borrar todos los datos y volver a empezar?")){ localStorage.removeItem(DB_KEY); db = seed(); save(); location.hash = "#/dashboard"; navigate(); } }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now()); }
function today(){ return new Date().toISOString().slice(0,10); }
function addMonths(d, m){ const dt = new Date(d + "T00:00:00"); dt.setMonth(dt.getMonth() + m); return dt.toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000); }
function r2(v){ return Math.round(v * 100) / 100; }
function addBal(c, delta){ c.balance = r2((c.balance || 0) + delta); }

/* Plan de amortización francés (cuota fija) */
function frenchSchedule(amount, annualRate, months, start){
  const r = annualRate / 12, n = months;
  const payment = r <= 0 ? amount / n : amount * r / (1 - Math.pow(1 + r, -n));
  let balance = amount; const out = [];
  for(let i = 1; i <= months; i++){
    const interest = balance * r;
    const principal = (i === months) ? balance : payment - interest;
    balance = Math.max(balance - principal, 0);
    out.push({ id: uid(), number: i, due_date: addMonths(start, i),
      principal: r2(principal), interest: r2(interest), total: r2(principal + interest),
      balance: r2(balance), paid_amount: 0, payments: [] });
  }
  return out;
}
function effStatus(i){ return i.paid_amount >= i.total - 0.005 ? "paid" : (i.due_date < today() ? "late" : "pending"); }
function loanStatus(l){ if(l.status === "requested") return "requested"; if(l.installments.every(i => effStatus(i) === "paid")) return "paid"; return l.installments.some(i => effStatus(i) === "late") ? "late" : "active"; }
function disbursed(l){ return l.status !== "requested"; }
function companyOf(l){ return db.companies.find(c => c.id === l.company_id); }
function seed(){
  const c1 = { id: uid(), name: "Empresa Andina SAC", ruc: "20100012345", contact_email: "finanzas@andina.pe", contact_phone: "+51 1 555 0101", created_at: today(), balance: 0 };
  const c2 = { id: uid(), name: "TechSoluciones EIRL", ruc: "20600067890", contact_email: "contabilidad@techsol.pe", contact_phone: "+51 1 555 0202", created_at: today(), balance: 0 };
  const c3 = { id: uid(), name: "AgroInversiones Norte", ruc: "20450098765", contact_email: "cobranzas@agronorte.pe", contact_phone: "+51 73 555 0303", created_at: today(), balance: 0 };
  return { companies: [c1, c2, c3], loans: [] };
}

/* ============ Formato / UI ============ */
const money = (v, cur="USD") => (cur === "USD" ? "US$ " : "S/ ") + Number(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => (Number(v) * 100).toLocaleString("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
const fmtDate = s => { const [y,m,d] = String(s).slice(0,10).split("-"); return d + "/" + m + "/" + y; };
function badge(s){ const l = { active:"Activo", paid:"Pagado", late:"Vencido", pending:"Pendiente", requested:"Solicitado" }[s] || s; return `<span class="badge badge-${s}">${l}</span>`; }
function toast(msg, type="ok"){ const r = document.getElementById("toast-root"); const el = document.createElement("div"); el.className = "toast toast-" + type; el.textContent = msg; r.appendChild(el); setTimeout(() => el.remove(), 3000); }
function openModal(html){ const d = document.createElement("dialog"); d.className = "modal"; d.innerHTML = html; document.body.appendChild(d); d.showModal(); d.addEventListener("click", e => { if(e.target === d) d.close(); }); return d; }

/*__JS_MORE__*/
</script>
</body>
</html>
